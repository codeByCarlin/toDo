<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Minhas tarefas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">

    <style>

        :root {

            --bg: #eef1f4;

            --surface: #ffffff;

            --ink: #17222c;

            --muted: #5d6b78;

            --line: #d5dce2;

            --accent: #0e6a6a;

            --accent-ink: #ffffff;

            --accent-soft: #dcefee;

            --danger: #a8322b;

            --danger-soft: #f8e4e2;

            --radius: 10px;

            --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

        }

        @media (prefers-color-scheme: dark) {

            :root {

                --bg: #12181e;

                --surface: #1b242c;

                --ink: #e8edf1;

                --muted: #93a1ad;

                --line: #2e3a44;

                --accent: #4cc2bd;

                --accent-ink: #08201f;

                --accent-soft: #17353a;

                --danger: #ff8d85;

                --danger-soft: #3a1f1d;

            }

        }

        { box-sizing: border-box; }
        html, body { margin: 0; }

        body {

            background: var(--bg);

            color: var(--ink);

            font-family: var(--font);

            font-size: 16px;

            line-height: 1.5;

            min-height: 100vh;

        }

        main {

            max-width: 680px;

            margin: 0 auto;

            padding: 48px 20px 80px;

        }

        header h1 {

            font-size: clamp(2rem, 6vw, 3rem);

            font-weight: 700;

            letter-spacing: -0.02em;

            line-height: 1.05;

            margin: 0 0 6px;

        }

        header p { margin: 0; color: var(--muted); }





        .new {

            margin-top: 32px;

            background: var(--surface);

            border: 1px solid var(--line);

            border-radius: var(--radius);

            padding: 16px;

            display: grid;

            gap: 10px;

        }

        label.sr { position: absolute; left: -9999px; }

        input[type="text"], textarea {

            width: 100%;

            font: inherit;

            color: var(--ink);

            background: var(--bg);

            border: 1px solid var(--line);

            border-radius: 8px;

            padding: 10px 12px;

        }

        textarea { resize: vertical; min-height: 64px; }

        input::placeholder, textarea::placeholder { color: var(--muted); }

        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }



        button {

            font: inherit;

            cursor: pointer;

            border-radius: 8px;

            border: 1px solid var(--line);

            background: var(--surface);

            color: var(--ink);

            padding: 8px 14px;

        }

        button:hover { border-color: var(--muted); }

        button.primary {

            background: var(--accent);

            color: var(--accent-ink);

            border-color: var(--accent);

            font-weight: 500;

        }

        button.primary:hover { filter: brightness(1.08); }

        button.danger { color: var(--danger); }

        button.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

        button.small { padding: 4px 10px; font-size: 0.875rem; }

        button:disabled { opacity: 0.55; cursor: progress; }

        .new .row { display: flex; justify-content: flex-end; }





        .tools {

            margin-top: 28px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            align-items: center;

        }

        .tools input { flex: 1 1 220px; }

        .tabs { display: flex; gap: 4px; }

        .tabs button {

            border-color: transparent;

            background: transparent;

            color: var(--muted);

        }

        .tabs button[aria-pressed="true"] {

            background: var(--accent-soft);

            color: var(--accent);

            font-weight: 500;

        }



        .count { margin: 16px 0 8px; color: var(--muted); font-size: 0.9rem; }





        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

        li.task {

            background: var(--surface);

            border: 1px solid var(--line);

            border-radius: var(--radius);

            padding: 14px 16px;

            display: grid;

            grid-template-columns: auto 1fr auto;

            gap: 4px 14px;

            align-items: start;

        }

        li.task input[type="checkbox"] {

            width: 22px; height: 22px;

            margin: 2px 0 0;

            accent-color: var(--accent);

            cursor: pointer;

        }

        .task h3 { margin: 0; font-size: 1.05rem; font-weight: 500; overflow-wrap: anywhere; }

        .task p { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }

        .task time { display: block; margin-top: 6px; color: var(--muted); font-size: 0.8rem; }

        .task.done h3 { text-decoration: line-through; color: var(--muted); }

        .actions { display: flex; gap: 6px; }





        .banner {

            margin-top: 20px;

            padding: 12px 14px;

            border-radius: var(--radius);

            background: var(--danger-soft);

            color: var(--danger);

            border: 1px solid var(--danger);

        }

        .banner[hidden] { display: none; }

        .empty {

            text-align: center;

            color: var(--muted);

            padding: 36px 16px;

            border: 1px dashed var(--line);

            border-radius: var(--radius);

        }





        dialog {

            border: 1px solid var(--line);

            border-radius: var(--radius);

            background: var(--surface);

            color: var(--ink);

            padding: 20px;

            width: min(480px, calc(100vw - 32px));

        }

        dialog::backdrop { background: rgba(10, 16, 22, 0.55); }

        dialog h2 { margin: 0 0 14px; font-size: 1.25rem; }

        dialog form { display: grid; gap: 10px; }

        dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

        dialog label { font-size: 0.9rem; color: var(--muted); }



        @media (max-width: 480px) {

            li.task { grid-template-columns: auto 1fr; }

            .actions { grid-column: 2; }

        }

        @media (prefers-reduced-motion: no-preference) {

            button { transition: background 0.15s, border-color 0.15s; }

        }

    </style>

</head>

<body>

<main>

    <header>

        <h1>Minhas tarefas</h1>

        <p>Anote, marque como feita e apague o que já passou.</p>

    </header>



    <div id="erro" class="banner" role="alert" hidden></div>



    <form id="form-nova" class="new">

        <label class="sr" for="novo-titulo">Título</label>

        <input type="text" id="novo-titulo" placeholder="O que precisa ser feito?" maxlength="100" required>

        <label class="sr" for="nova-desc">Descrição</label>

        <textarea id="nova-desc" placeholder="Detalhes (opcional)"></textarea>

        <div class="row"><button class="primary" type="submit">Adicionar tarefa</button></div>

    </form>



    <div class="tools">

        <label class="sr" for="busca">Buscar por título</label>

        <input type="text" id="busca" placeholder="Buscar por título">

        <div class="tabs" role="group" aria-label="Filtrar tarefas">

            <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>

            <button type="button" data-filtro="pendentes" aria-pressed="false">Pendentes</button>

            <button type="button" data-filtro="concluidas" aria-pressed="false">Concluídas</button>

        </div>

    </div>



    <p class="count" id="contagem" aria-live="polite"></p>

    <ul id="lista"></ul>

</main>



<dialog id="dialogo">

    <h2>Editar tarefa</h2>

    <form id="form-editar" method="dialog">

        <div>

            <label for="edit-titulo">Título</label>

            <input type="text" id="edit-titulo" maxlength="100" required>

        </div>

        <div>

            <label for="edit-desc">Descrição</label>

            <textarea id="edit-desc"></textarea>

        </div>

        <div class="row">

            <button type="button" id="cancelar">Cancelar</button>

            <button type="submit" class="primary">Salvar alterações</button>

        </div>

    </form>

</dialog>



<script>



    const API = "http://localhost:8080/task";





    const $ = (id) => document.getElementById(id);

    let tarefas = [];

    let filtro = "todas";

    let editandoId = null;




    async function chamar(caminho = "", opcoes = {}) {

        let resp;

        try {

            resp = await fetch(API + caminho, {

                headers: { "Content-Type": "application/json" },

                ...opcoes,

            });

        } catch (e) {

            throw new Error(

                "Não consegui falar com a API em " + API +

                ". Confira se o back está rodando e se o CORS está liberado."

            );

        }

        if (!resp.ok) {

            throw new Error("A API respondeu com erro " + resp.status + ". Veja o console do Spring para detalhes.");

        }

        return resp.status === 204 ? null : resp.json();

    }



    const api = {

        listar: () => chamar(),

        criar: (t) => chamar("", { method: "POST", body: JSON.stringify(t) }),

        atualizar: (id, t) => chamar("/" + id, { method: "PUT", body: JSON.stringify(t) }),

        concluir: (id, completed) =>

            chamar("/" + id + "/complete", { method: "PATCH", body: JSON.stringify({ completed }) }),

        apagar: (id) => chamar("/" + id, { method: "DELETE" }),

    };




    function mostrarErro(msg) {

        const el = $("erro");

        el.textContent = msg;

        el.hidden = !msg;

    }



    async function tentar(acao) {

        try {

            mostrarErro("");

            await acao();

        } catch (e) {

            mostrarErro(e.message);

        }

    }



    function formatarData(valor) {

        if (!valor) return "";

        const [a, m, d] = String(valor).slice(0, 10).split("-");

        return d + "/" + m + "/" + a;

    }




    function render() {

        const termo = $("busca").value.trim().toLowerCase();

        const visiveis = tarefas.filter((t) => {

            if (filtro === "pendentes" && t.completed) return false;

            if (filtro === "concluidas" && !t.completed) return false;

            return (t.title || "").toLowerCase().includes(termo);

        });



        const pendentes = tarefas.filter((t) => !t.completed).length;

        $("contagem").textContent =

            tarefas.length === 0

                ? ""

                : pendentes + (pendentes === 1 ? " tarefa pendente" : " tarefas pendentes") +

                " de " + tarefas.length;



        const lista = $("lista");

        lista.replaceChildren();



        if (visiveis.length === 0) {

            const vazio = document.createElement("li");

            vazio.className = "empty";

            vazio.textContent =

                tarefas.length === 0

                    ? "Nenhuma tarefa ainda. Escreva a primeira no campo acima."

                    : "Nenhuma tarefa encontrada com esse filtro ou busca.";

            lista.append(vazio);

            return;

        }



        for (const t of visiveis) lista.append(criarItem(t));

    }



    function criarItem(t) {

        const li = document.createElement("li");

        li.className = "task" + (t.completed ? " done" : "");



        const check = document.createElement("input");

        check.type = "checkbox";

        check.checked = !!t.completed;

        check.setAttribute("aria-label", "Marcar \"" + t.title + "\" como concluída");

        check.addEventListener("change", () =>

            tentar(async () => {

                await api.concluir(t.id, check.checked);

                await carregar();

            }).then(() => { if ($("erro").hidden === false) check.checked = !check.checked; })

        );



        const corpo = document.createElement("div");

        const h = document.createElement("h3");

        h.textContent = t.title;

        corpo.append(h);

        if (t.description) {

            const p = document.createElement("p");

            p.textContent = t.description;

            corpo.append(p);

        }

        const data = formatarData(t.createDate ?? t.create_date);

        if (data) {

            const tm = document.createElement("time");

            tm.textContent = "Criada em " + data;

            corpo.append(tm);

        }



        const acoes = document.createElement("div");

        acoes.className = "actions";



        const editar = document.createElement("button");

        editar.type = "button";

        editar.className = "small";

        editar.textContent = "Editar";

        editar.addEventListener("click", () => abrirEdicao(t));



        const apagar = document.createElement("button");

        apagar.type = "button";

        apagar.className = "small danger";

        apagar.textContent = "Apagar";

        apagar.addEventListener("click", () => {

            if (!confirm("Apagar \"" + t.title + "\"?")) return;

            tentar(async () => {

                await api.apagar(t.id);

                await carregar();

            });

        });



        acoes.append(editar, apagar);

        li.append(check, corpo, acoes);

        return li;

    }




    async function carregar() {

        tarefas = await api.listar();

        tarefas.sort((a, b) => Number(a.completed) - Number(b.completed) || b.id - a.id);

        render();

    }



    $("form-nova").addEventListener("submit", (e) => {

        e.preventDefault();

        const title = $("novo-titulo").value.trim();

        if (!title) return;

        const botao = e.submitter;

        botao.disabled = true;

        tentar(async () => {

            await api.criar({ title, description: $("nova-desc").value.trim() });

            $("form-nova").reset();

            await carregar();

            $("novo-titulo").focus();

        }).finally(() => (botao.disabled = false));

    });



    function abrirEdicao(t) {

        editandoId = t.id;

        $("edit-titulo").value = t.title;

        $("edit-desc").value = t.description ?? "";

        $("dialogo").showModal();

        $("edit-titulo").focus();

    }



    $("cancelar").addEventListener("click", () => $("dialogo").close());



    $("form-editar").addEventListener("submit", () => {

        const original = tarefas.find((t) => t.id === editandoId);

        tentar(async () => {

            await api.atualizar(editandoId, {

                title: $("edit-titulo").value.trim(),

                description: $("edit-desc").value.trim(),

                completed: original ? !!original.completed : false,

            });

            await carregar();

        });

    });



    $("busca").addEventListener("input", render);



    document.querySelectorAll(".tabs button").forEach((b) =>

        b.addEventListener("click", () => {

            filtro = b.dataset.filtro;

            document.querySelectorAll(".tabs button").forEach((x) =>

                x.setAttribute("aria-pressed", String(x === b))

            );

            render();

        })

    );



    tentar(carregar);

</script>

</body>

</html>
